<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Resultado del sorteo · Naowee</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="design-system.css"/>
<link rel="stylesheet" href="competition-render.css"/>
<style>
:root{
  --naranja:#FF7500;--azul:#002B5B;--accent:#d74009;
  --text-primary:#282834;--text-secondary:#646587;--text-muted:#9aaab8;
  --green:#1f8923;--green-bg:#e6f4e7;--green-border:#b7dfb9;
  --surface:#fff;--bg:#f5f6fa;--bg-soft:#f5f6fa;--border:#e7e9f3;--border-dark:#d0d4e6;
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:20px;--radius-full:9999px;
  --orange-bg:#fff3e6;--orange-border:#ffbf75;--red-bg:#fff0ee;--red-border:#ffc4bb;--blue-info:#1f78d1;--blue-bg:#eef5ff;--purple:#7c3aed;
  --shadow-sm:0 1px 4px rgba(0,0,0,.08);--shadow-card:0 0 2px rgba(145,158,171,.2),0 12px 24px -4px rgba(145,158,171,.12);
  --font:'Inter',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.pub-header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.pub-brand{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--azul);font-size:15px;letter-spacing:.3px}
.pub-brand .pub-suid{padding-left:12px;border-left:1px solid var(--border);color:var(--text-secondary);font-weight:700}
.pub-tag{margin-left:auto;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:var(--radius-full);padding:5px 13px}
.pub-main{max-width:1000px;margin:0 auto;padding:26px 22px 60px}
.pub-hero{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#fff6ef,#fbfcff);border:1px solid var(--border);border-radius:var(--radius-xl);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-card)}
.pub-emoji{width:62px;height:62px;flex:0 0 62px;border-radius:var(--radius-lg);background:#fff;border:1px solid var(--border);display:grid;place-items:center;font-size:34px}
.pub-hero h1{margin:0;font-size:23px;font-weight:800;color:var(--text-primary)}
.pub-hero p{margin:4px 0 0;font-size:14px;color:var(--text-secondary);font-weight:500}
.pub-hero .pub-estado{margin-left:auto}
.pub-actions{display:flex;justify-content:flex-end;margin-bottom:10px}
.pub-sec{margin:26px 0 10px}
.pub-sec-h{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.pub-empty{text-align:center;padding:70px 24px;color:var(--text-secondary)}
.pub-empty h2{color:var(--text-primary);font-size:18px;margin:0 0 8px}
.pub-foot{max-width:1000px;margin:0 auto;padding:18px 22px 40px;color:var(--text-muted);font-size:12px;text-align:center}
/* programación read-only */
.pubp-list{display:flex;flex-direction:column;gap:8px}
.pubp-row{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.pubp-match{font-size:13.5px;font-weight:700;color:var(--text-primary)}
.pubp-match small{display:block;font-size:11px;font-weight:500;color:var(--text-secondary);margin-top:4px}
/* Equipo dos tonos (paridad con la vista de edición): nombre negro + región·categoría gris */
.pubp-match__teams{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.pubp-team{display:flex;flex-direction:column;min-width:0;max-width:100%}
.pubp-team__name{font-size:13.5px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pubp-team__meta{font-size:11px;font-weight:500;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pubp-vs{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--text-secondary);background:var(--bg-soft,#f1f2f7);border-radius:4px;padding:1px 5px;margin:1px 0}
.pubp-when{font-size:13px;color:var(--text-primary);text-align:right}
.pubp-when small{display:block;font-size:11px;color:var(--text-secondary)}
@media(max-width:620px){.pubp-row{grid-template-columns:1fr}.pubp-when{text-align:left}}
@media print{
  .pub-header,.pub-actions,.pub-foot{display:none!important}
  body{background:#fff}
  .pub-hero{box-shadow:none}
  .pub-sec{page-break-inside:avoid}
}
</style>
</head>
<body>
<header class="pub-header">
  <div class="pub-brand">Ministerio del Deporte<span class="pub-suid">SUID</span></div>
  <span class="pub-tag">Resultado oficial</span>
</header>
<main class="pub-main">
  <div class="pub-actions"><button class="naowee-btn naowee-btn--mute naowee-btn--small" onclick="window.print()"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 6V2.5h8V6M4 12H3a1 1 0 01-1-1V7a1 1 0 011-1h10a1 1 0 011 1v4a1 1 0 01-1 1h-1M4 10h8v4H4z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Imprimir</button></div>
  <div id="pubContent"></div>
</main>
<div class="pub-foot">Sistema Único de Información del Deporte · Naowee — Vista pública del sorteo</div>

<script src="sorteo-store.js"></script>
<script src="competition-render.js?v=2.1.1"></script>
<script>
(function(){
  'use strict';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];}); }
  function getId(){ var m=location.search.match(/[?&]id=([^&#]+)/); return m?decodeURIComponent(m[1]):null; }
  function fmtFecha(iso){ if(!iso)return ''; try{ var d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return iso; } }
  var el=document.getElementById('pubContent');
  var id=getId();
  var rec=(id&&window.SorteoStore)?SorteoStore.get(id):null;
  if(!rec||!rec.comp){
    el.innerHTML='<div class="pub-empty"><h2>Sorteo no encontrado</h2><p>El resultado solicitado no está disponible o aún no se ha publicado.</p></div>';
    return;
  }
  var c=rec.comp, anu=rec.estado==='ANULADO';
  var R=window.CompRender||{};
  function sec(title,icon,body){ return '<section class="pub-sec"><h3 class="pub-sec-h">'+icon+esc(title)+'</h3>'+body+'</section>'; }
  var ICO={ grupos:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    pos:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 13.5V8M8 13.5V2.5M13 13.5V6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    llave:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 3.5h3.5v3H9M2 12.5h3.5v-3M9 5h2.5v3H14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    medal:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="10" r="3.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 6.6L4.5 2h3L9 5.2M10 6.6L11.5 2h-3" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    prog:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>' };

  var html='';
  html+='<div class="pub-hero"><span class="pub-emoji">'+(c.emoji||'🏆')+'</span><div><h1>'+esc(c.nombre||'Sorteo')+'</h1><p>'+esc(c.sistema||'')+(c.sisCls==='elim'?'':' · '+((c.grupos||[]).length)+' grupos')+'</p></div><span class="pub-estado">'+(anu?'<span class="naowee-badge naowee-badge--negative naowee-badge--large">Anulado</span>':'<span class="naowee-badge naowee-badge--positive naowee-badge--large">Publicado</span>')+'</span></div>';

  if(anu){ html+='<div class="naowee-message naowee-message--negative" style="width:100%"><div class="naowee-message__header"><span class="naowee-message__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M7 5h2v4H7z" fill="#fff"/><circle cx="8" cy="11" r="1" fill="#fff"/></svg></span><span class="naowee-message__title">Sorteo anulado</span></div><p class="naowee-message__text">'+(rec.motivo?('Motivo: '+esc(rec.motivo)+'. '):'')+'Este resultado fue anulado y no es vigente.</p></div>'; }

  if(c.grupos&&c.grupos.length){
    if(R.renderGrupos) html+=sec('Grupos y calendario',ICO.grupos,R.renderGrupos(c));
    if(R.renderStandings) html+=sec('Posiciones',ICO.pos,c.grupos.map(function(g){return R.renderStandings(g);}).join(''));
  }
  if(c.bracket&&c.bracket.length){
    if(R.renderBracket) html+=sec('Llave de eliminación',ICO.llave,R.renderBracket(c));
    if(R.renderMedalleria) html+=sec('Medallería',ICO.medal,R.renderMedalleria(c));
  }

  // Programación (read-only) si algún partido tiene fecha
  var prog=[];
  (c.grupos||[]).forEach(function(g){ (g.partidos||[]).forEach(function(p){ if(p.fecha||p.hora||p.escenario) prog.push({t1:p.t1,t2:p.t2,ctx:g.nombre+' · J'+p.jornada,fecha:p.fecha,hora:p.hora,esc:p.escenario}); }); });
  (c.bracket||[]).forEach(function(rd){ (rd.matches||[]).forEach(function(m){ if(m.fecha||m.hora||m.escenario) prog.push({t1:m.t1,t2:m.t2,ctx:rd.round,fecha:m.fecha,hora:m.hora,esc:m.escenario}); }); });
  if(prog.length){
    var pubTeam=function(name){ var meta=(c&&c.teamMeta&&c.teamMeta[name])||''; return '<span class="pubp-team"><span class="pubp-team__name">'+esc(name||'')+'</span>'+(meta?'<span class="pubp-team__meta">'+esc(meta)+'</span>':'')+'</span>'; };
    var rows=prog.map(function(x){ var when=[fmtFecha(x.fecha),esc(x.hora)].filter(Boolean).join(' · '); return '<div class="pubp-row"><div class="pubp-match"><div class="pubp-match__teams">'+pubTeam(x.t1)+'<span class="pubp-vs">vs</span>'+pubTeam(x.t2)+'</div><small>'+esc(x.ctx)+'</small></div><div class="pubp-when">'+(when||'Por programar')+'<small>'+esc(x.esc||'Escenario por definir')+'</small></div></div>'; }).join('');
    html+=sec('Programación',ICO.prog,'<div class="pubp-list">'+rows+'</div>');
  }

  el.innerHTML=html;
  try{ document.title=(c.nombre||'Resultado del sorteo')+' · Naowee'; }catch(e){}
})();
</script>
</body>
</html>
